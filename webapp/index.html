<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Paphos Villas — Telegram Mini App</title>
    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="ambient-glow"></div>
    <div class="ambient-glow-secondary"></div>

    <!-- Header / Brand -->
    <header class="app-header">
        <div class="brand">
            <div class="brand-icon">🏡</div>
            <div class="brand-text">
                <h1>PAPHOS VILLAS</h1>
                <span class="brand-sub">Cyprus Real Estate Catalog</span>
            </div>
        </div>
        <div class="user-chip" id="userChip">
            <span class="user-avatar" id="userAvatar">👤</span>
            <span class="user-name" id="userName">Гость</span>
        </div>
    </header>

    <!-- Navigation Tabs -->
    <nav class="nav-tabs">
        <button class="tab-btn active" data-category="rent_paphos">
            <span class="tab-icon">🏢</span>
            <span class="tab-label">Аренда вилл</span>
        </button>
        <button class="tab-btn" data-category="sale_villa">
            <span class="tab-icon">🏡</span>
            <span class="tab-label">Продажа вилл</span>
        </button>
        <button class="tab-btn" data-category="favorites">
            <span class="tab-icon">❤️</span>
            <span class="tab-label">Избранное</span>
            <span class="fav-badge" id="favCountBadge">0</span>
        </button>
    </nav>

    <!-- Search and Filters -->
    <section class="filters-section">
        <div class="search-bar">
            <span class="search-icon">🔍</span>
            <input type="text" id="searchInput" placeholder="Поиск по району (Тала, Корал Бэй, бассейн...)" autocomplete="off">
            <button class="clear-search" id="clearSearchBtn" title="Очистить">&times;</button>
        </div>
        <div class="budget-pills" id="budgetPills">
            <!-- Dynamically generated pills -->
        </div>
    </section>

    <!-- Villas Grid -->
    <main class="villas-container">
        <div class="loading-state" id="loadingState">
            <div class="spinner"></div>
            <p>Загрузка предложений Пафоса...</p>
        </div>

        <div class="villas-grid" id="villasGrid">
            <!-- Villa cards will be inserted here -->
        </div>

        <div class="empty-state hidden" id="emptyState">
            <div class="empty-icon">🏖️</div>
            <h3>Ничего не найдено</h3>
            <p>Попробуйте изменить фильтр бюджета или слово для поиска</p>
            <button class="reset-filter-btn" id="resetFiltersBtn">Сбросить фильтры</button>
        </div>
    </main>

    <!-- Bottom Detail Sheet (Modal) -->
    <div class="modal-overlay hidden" id="villaModalOverlay">
        <div class="modal-sheet">
            <div class="modal-handle"></div>
            <button class="modal-close" id="modalCloseBtn">&times;</button>
            <div class="modal-content" id="modalContent">
                <!-- Dynamically filled villa details -->
            </div>
        </div>
    </div>

    <!-- Notification Toast -->
    <div class="toast hidden" id="toast">✅ Сохранено в Избранное</div>

    <script src="app.js"></script>
</body>
</html>
